<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>
    <script src="https://kit.fontawesome.com/ffd6b4d8a6.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/images/favicon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div id="logo-sec">
                <!-- Logo -->
                <img id="1" src="assets/images/BiteBoxLogo.PNG" width="150px" alt="">
                <!-- <a href="http://127.0.0.1:5500/ApnaStore/index.html"><img id="1" src="assets/images/image1-removebg-preview(1).png" alt="logo" width="150px"></a> -->
            </div>
                <!-- Menu -->
            <ul style="list-style-type: none;">
                    <li><a href="index.html"><i class="fa-solid fa-house"></i>Home</a></li>
                    <li><a href="Menu.html"><i class="fa-solid fa-bars-staggered"></i>Menu</a></li>
                    <li><a href="BiteDeals.html"><i class="fa-solid fa-tags"></i>BiteDeals</a></li>
                    <li><a href="Cart.html" class="active"><i class="fa-solid fa-cart-arrow-down"></i>MyCart</a></li>
                    <li><a href="Login.html"><i class="fa-solid fa-arrow-right-to-bracket"></i>Login</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>My Cart</h2>
        <section class="cart">
            <table>
                <thead>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Remove</th>
                </thead>
                <tbody>
                    <tr>
                        <td class="food-item">
                            <img src="assets/images/card/cheesy-burger.png" alt="Chessy Burger">
                            <div>
                                <h4>Chessy Burger</h4>
                                <p>Classical Chessy Burger</p>
                            </div>
                        </td>
                        <td>&#8377;199</td>
                        <td>
                            <div class="qty"><button>-</button> <span>1</span> <button>+</button></div>
                        </td>
                        <td>&#8377;199</td>
                        <td><button class="remove">X</button></td>
                    </tr>
                    <tr>
                        <td class="food-item">
                            <img src="assets/images/card/peppyPanner-pizza.png" alt="Chessy Burger">
                            <div>
                                <h4>Peppy Panner Pizza</h4>
                                <p>BiteBox's Special Peppy panner pizza</p>
                            </div>
                        </td>
                        <td>&#8377;359</td>
                        <td>
                            <div class="qty"><button>-</button> <span>1</span> <button>+</button></div>
                        </td>
                        <td>&#8377;359</td>
                        <td><button class="remove">X</button></td>
                    </tr>
                    <tr class="grand-total">
                        <td colspan="3">Grand Total</td>
                        <td>&#8377;558</td>
                        <td><button class="proceed">Proceed</button></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    
</body>
</html>
