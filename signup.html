<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBox</title>
    <script src="https://kit.fontawesome.com/ffd6b4d8a6.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/images/favicon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <!-- Start Authentication Section -->
        <section class="auth-container">
            <div class="auth-box">
                <h2>Create Account</h2>
                <form action="">
                    <label for="name"></label>
                    <input type="text" placeholder="Full Name" name="name" id="name" required>
                    <input type="email" placeholder="Enter Email" name="email" id="email" required>
                    <label for="email"></label>
                    <label for="pass1"></label>
                    <input type="password" placeholder="Password" name="pass" id="pass1" required>
                    
                    <label for="pass2"></label>
                    <input type="password" placeholder="Confirm Password" name="cnfpass" id="pass2" required>
                    <button type="submit">SignUp</button>
                </form>
                <p>Already have Account? <a href="Login.html">Login</a></p>
            </div>
        </section>
        <!-- Start Authentication Section -->

    </main>
</body>
</html>
