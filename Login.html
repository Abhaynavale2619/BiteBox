<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBox</title>
    <script src="https://kit.fontawesome.com/ffd6b4d8a6.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/images/favicon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Start Authentication Section -->
    <section class="auth-container">
        <div class="auth-box">
            <h2>Login to Bite<span style="color: red;">Box</span></h2>
            <form action="">
                <label for="email"></label>
                <input type="email" placeholder="Enter Email" name="email" id="email" required>
                <div style="position: relative;">
                    <label for="pass"></label>
                    <input type="password" placeholder="Enter Password" name="pass" id="pass" required>
                    <span onclick="togglePassword()" style="color:red; cursor: pointer; position: absolute; top: 50%; right: 10px; transform: translateY(-50%);"><i class="fa-solid fa-eye" id="togglePassword"></i></span>
                </div>
                <button type="button" onclick="login()">Login</button>
            </form>
            <p id="error" style="color: red;"></p>
            <p><a href="signup.html">Forgot Password</a></p>
            <p>Don't have an Account <a href="signup.html">SignUp</a></p>
        </div>
    </section>
    <!-- End Authentication Section -->


    <script src="javaScript/scripts.js"></script>
</body>
</html>
